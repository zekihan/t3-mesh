name: T3 Compatibility

# Runs the hub and an agent in front of a real `t3 serve` (see TestT3Compat in
# test/integration) for the newest upstream nightly and for the nightly the
# machines run, and keeps one issue open while either breaks.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      t3_versions:
        description: >-
          T3 versions to check, separated by commas or spaces (for example
          0.1.11-nightly.20261118.4890). Empty checks the latest nightly and the deployed one.
          A run with versions given does not open or close the issue.
        type: string
        default: ""

concurrency:
  group: t3-compat
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The fork whose newest release names the nightly the stack and the machines track,
  # on a `t3mesh-base: v<version>` line of its body.
  DEPLOYED_REPO: zekihan/t3code
  ISSUE_TITLE: T3 nightly compatibility

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve the T3 versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.t3_versions }}
        shell: bash
        run: |
          set -euo pipefail

          shape='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          entries='[]'

          add() {
            entries=$(jq -c --arg v "$1" --arg l "$2" '
              if any(.[]; .version == $v)
              then map(if .version == $v then .label += ", " + $l else . end)
              else . + [{version: $v, label: $l}] end' <<<"$entries")
          }

          if [ -n "$REQUESTED" ]; then
            for v in ${REQUESTED//,/ }; do
              v="${v#v}"
              if [[ ! "$v" =~ $shape ]]; then
                echo "::error::'$v' is not a T3 version"
                exit 1
              fi
              add "$v" requested
            done
          else
            latest=$(npm view t3@nightly version)
            if [[ ! "$latest" =~ $shape ]]; then
              echo "::error::npm reports the latest nightly as '$latest'"
              exit 1
            fi
            add "$latest" latest

            # The deployed nightly is optional: without it only the latest is checked.
            body=$(gh api "repos/${DEPLOYED_REPO}/releases/latest" --jq .body || true)
            deployed=$(sed -n 's/^t3mesh-base: v\{0,1\}\([^[:space:]]*\)[[:space:]]*$/\1/p' <<<"$body" | head -n 1)
            if [[ ! "$deployed" =~ $shape ]]; then
              echo "::warning::no t3mesh-base in the newest ${DEPLOYED_REPO} release; checking the latest nightly only"
            elif ! npm view "t3@${deployed}" version >/dev/null 2>&1; then
              echo "::warning::the deployed nightly ${deployed} is not on npm; checking the latest nightly only"
            else
              add "$deployed" deployed
            fi
          fi

          echo "$entries" | jq .
          echo "matrix=$(jq -c '{include: .}' <<<"$entries")" >> "$GITHUB_OUTPUT"

  compat:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: t3 ${{ matrix.label }} (${{ matrix.version }})
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - name: Install T3
        env:
          VERSION: ${{ matrix.version }}
        run: |
          npm install -g "t3@${VERSION}"
          command -v t3
          t3 --version

      - name: Test the hub and agent against T3
        env:
          RESULTS: ${{ runner.temp }}/compat.json
        shell: bash
        run: |
          set -euo pipefail

          export T3_COMPAT_BINARY
          T3_COMPAT_BINARY=$(command -v t3)

          go test -json -count=1 -timeout 20m -run '^TestT3Compat$' ./test/integration |
            tee "$RESULTS" |
            jq -Rrj 'fromjson? | select(.Action == "output") | .Output'

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULTS: ${{ runner.temp }}/compat.json
          SUMMARY: ${{ runner.temp }}/summary-${{ strategy.job-index }}.md
          STATUS: ${{ job.status }}
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### t3 ${VERSION} (${LABEL}): ${STATUS}"
            echo

            if [ "$STATUS" != success ] && [ ! -s "$RESULTS" ]; then
              echo "The test did not run; see the run log (installing T3 or building the test failed)."
            elif [ "$STATUS" != success ]; then
              # The failing leaf tests with what they printed.
              jq -Rrn '
                [inputs | fromjson?] as $ev
                | [$ev[] | select(.Action == "fail" and .Test != null) | .Test] as $failed
                | [$failed[] | select(. as $n | all($failed[]; . == $n or (startswith($n + "/") | not)))] as $leaves
                | if ($leaves | length) == 0 then "No test reported a failure; see the run log (a crash or a timeout)." else
                    $leaves[] as $n
                    | "- `\($n)`\n\n```\n"
                      + ([$ev[] | select(.Test == $n and .Action == "output") | .Output]
                         | join("") | split("\n")
                         | map(select(test("^\\s*(=== |--- )") | not)) | .[0:25] | join("\n"))
                      + "\n```\n"
                  end' "$RESULTS"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$SUMMARY"

      - name: Upload the summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ strategy.job-index }}
          path: ${{ runner.temp }}/summary-${{ strategy.job-index }}.md
          if-no-files-found: ignore
          retention-days: 3

  report:
    needs: [versions, compat]
    # A run with versions given by hand says nothing about the deployed stack.
    if: ${{ always() && inputs.t3_versions == '' && needs.compat.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-*
          path: summaries
          merge-multiple: true
        # Nothing to download when the versions could not be resolved.
        continue-on-error: true

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSIONS_RESULT: ${{ needs.versions.result }}
          COMPAT_RESULT: ${{ needs.compat.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | first | .number // empty")

          summaries=""
          for f in summaries/summary-*.md; do
            if [ -e "$f" ]; then
              summaries+="$(cat "$f")"$'\n\n'
            fi
          done

          if [ "$VERSIONS_RESULT" = success ] && [ "$COMPAT_RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Passing again: ${RUN_URL}"$'\n\n'"${summaries}"
              gh issue close "$number"
            fi
            exit 0
          fi

          body="The hub and agent no longer pass against T3. Run: ${RUN_URL}"$'\n\n'
          if [ "$VERSIONS_RESULT" != success ]; then
            body+="The T3 versions to check could not be resolved; see the run."$'\n\n'
          fi
          body+="${summaries}"$'\n'"This issue is kept by .github/workflows/t3-compat.yaml: it is updated while the check fails and closed when it passes."
          body="${body:0:60000}"

          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
